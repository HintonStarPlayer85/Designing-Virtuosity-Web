name: Install Supported Counsel Identity Logo

on:
  push:
    paths:
      - "assets/identity-archive/.supported-counsel-trigger"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Supported Counsel logo
        run: |
          cat assets/identity-archive/.supported-counsel-parts/part*.b64             | tr -d '\n\r '             | base64 -d > assets/identity-archive/supported-counsel.webp
          test -s assets/identity-archive/supported-counsel.webp
          file assets/identity-archive/supported-counsel.webp

      - name: Remove one-time staging files
        run: |
          rm -rf assets/identity-archive/.supported-counsel-parts
          rm -f assets/identity-archive/.supported-counsel-trigger
          rm -f .github/workflows/install-supported-counsel-logo.yml

      - name: Commit Supported Counsel logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add alternate Supported Counsel Identity Archive logo"
          git push
