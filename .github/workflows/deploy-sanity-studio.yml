name: Deploy Sanity Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - ".github/workflows/deploy-sanity-studio.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_STUDIO_PROJECT_ID: rx0hc1vo
      SANITY_STUDIO_DATASET: production
      SANITY_STUDIO_HOSTNAME: designing-virtuosity
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install Studio dependencies
        run: npm install

      - name: Allow website origins to read published content
        shell: bash
        run: |
          set -euo pipefail
          for origin in "https://designingvirtuosity.com" "https://www.designingvirtuosity.com"; do
            if npx sanity@latest cors list --project-id "$SANITY_STUDIO_PROJECT_ID" | grep -Fq "$origin"; then
              echo "$origin is already allowed."
            else
              npx sanity@latest cors add "$origin" --project-id "$SANITY_STUDIO_PROJECT_ID" --yes
            fi
          done

      - name: Deploy Studio and schema
        run: npx sanity@latest deploy --url "$SANITY_STUDIO_HOSTNAME" --yes --schema-required
