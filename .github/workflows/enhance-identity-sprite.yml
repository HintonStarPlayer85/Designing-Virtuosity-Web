name: Enhance Identity Archive Sprite

on:
  push:
    paths:
      - "assets/identity-archive/.enhance-trigger"

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Upscale and sharpen Identity Archive sprite
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          path = Path("assets/identity-archive/identity-logo-sprite.webp")
          image = Image.open(path).convert("RGBA")
          width, height = image.size

          enhanced = image.resize(
              (width * 2, height * 2),
              Image.Resampling.LANCZOS
          )
          enhanced = enhanced.filter(
              ImageFilter.UnsharpMask(radius=1.1, percent=135, threshold=2)
          )
          enhanced.save(
              path,
              "WEBP",
              quality=92,
              method=6
          )
          print(f"Enhanced {width}x{height} -> {width * 2}x{height * 2}")
          PY

      - name: Remove temporary staging files
        run: |
          rm -rf assets/identity-archive/.sprite-parts
          rm -f assets/identity-archive/.enhance-trigger
          rm -f .github/workflows/enhance-identity-sprite.yml

      - name: Commit enhanced sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Enhance Identity Archive logos for high-DPI display"
          git push
