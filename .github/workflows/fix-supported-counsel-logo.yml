name: Fix Supported Counsel Identity Logo

on:
  push:
    paths:
      - "assets/identity-archive/.supported-fix-trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble corrected Supported Counsel logo
        run: |
          cat assets/identity-archive/.supported-fix/part*.b64             | tr -d '\n\r '             | base64 -d > assets/identity-archive/supported-counsel.webp
          python - <<'PY'
          from PIL import Image
          p="assets/identity-archive/supported-counsel.webp"
          im=Image.open(p)
          im.verify()
          print("Verified", p)
          PY

      - name: Remove temporary files
        run: |
          rm -rf assets/identity-archive/.supported-fix
          rm -f assets/identity-archive/.supported-fix-trigger
          rm -f .github/workflows/fix-supported-counsel-logo.yml

      - name: Commit corrected logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Supported Counsel Identity Archive logo"
          git push
