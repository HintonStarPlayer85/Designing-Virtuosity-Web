name: Launch Production SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_STUDIO_PROJECT_ID: rx0hc1vo
      SANITY_STUDIO_DATASET: production
      SANITY_CONTENT_TOKEN: ${{ secrets.SANITY_CONTENT_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install Studio dependencies
        run: npm install

      - name: Enable production indexing in Sanity and static HTML
        run: node scripts/launch-production-seo.mjs

      - name: Commit static SEO launch settings
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html portfolio.html contact.html
          if git diff --cached --quiet; then
            echo "Static SEO settings are already in launch state."
          else
            git commit -m "Launch Designing Virtuosity search indexing"
            git push
          fi
