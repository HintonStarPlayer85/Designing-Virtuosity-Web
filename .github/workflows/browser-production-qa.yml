name: Browser Production QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-production-qa.yml"
      - "qa/production.spec.js"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run production browser QA
        run: npx playwright test qa/production.spec.js --browser=chromium --workers=1
