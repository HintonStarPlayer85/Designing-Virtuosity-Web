name: Services Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services.html"
      - "css/services-experience.css"
      - "qa/services-visual.spec.js"
      - ".github/workflows/services-visual-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate Services visual treatment
        run: npx playwright test qa/services-visual.spec.js --browser=chromium --workers=1
