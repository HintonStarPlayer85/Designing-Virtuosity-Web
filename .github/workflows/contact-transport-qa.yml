name: Contact Transport QA

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contact-transport-qa.yml"
      - "qa/contact-submission.spec.js"

permissions:
  contents: read

jobs:
  contact-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Submit one live QA inquiry
        run: npx playwright test qa/contact-submission.spec.js --browser=chromium --workers=1
